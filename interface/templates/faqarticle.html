{% extends "base.html" %}
{% load translate %}

{% block maincontent %}
  <section class="intro-section bg-primary ellipse reverse">
    <div class="container">
      <hgroup class="flipped">
        <h1 class="h1 color-secondary">{% block faqarticletitle %}{% translate title %}{% endblock %}</h1>
        <p class="h5 color-secondary"><a href="/faqs/">{% translate "faqs title" %}</a></p>
      </hgroup>
    </div>
  </section>

  <section class="article-content-section">
    <div class="container">
      {% block faqarticlecontent %}{% translate content %}{% endblock %}
    </div>
  </section>

  {% include "partials/faq-contact.html" %}
{% endblock %}
