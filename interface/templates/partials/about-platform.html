{% load static %}
{% load translate %}
{% if "INTERNETNL_BRANDING"|get_settings_value %}
  <section class="about-section {{ variant }}">
    <div class="container">
      <h2 class="h5 color-accent">{% translate "about mission-title" %}</h2>
      <p class="h4">{% translate "about mission" %}</p>
      <p class="body-xl">{% translate "about platform" %}</p>
      <ul class="logo-list">
        <li>
          <a href="https://surf.nl/" target="_blank" aria-label="Surf website">
            <img class="light-visible"
                 src="{% static 'images/surf.png' %}"
                 alt="Surf logo"
                 loading="lazy"
                 width="100"
                 height="52">
            <img class="dark-visible"
                 src="{% static 'images/surf-wit.png' %}"
                 alt="Surf logo"
                 loading="lazy"
                 width="100"
                 height="52">
          </a>
        </li>
        <li>
          <a href="https://ncsc.nl" target="_blank" aria-label="NCSC website">
            <img class="light-visible"
                 src="{% static 'images/ncsc.png' %}"
                 alt="NCSC logo"
                 loading="lazy"
                 width="224"
                 height="90">
            <img class="dark-visible"
                 src="{% static 'images/ncsc-wit.png' %}"
                 alt="NCSC logo"
                 loading="lazy"
                 width="224"
                 height="90">
          </a>
        </li>
        <li>
          <a href="https://nlnet.nl/" target="_blank" aria-label="NLnet website">
            <img class="light-visible"
                 src="{% static 'images/nlnet.png' %}"
                 alt="NLnet logo"
                 loading="lazy"
                 width="146"
                 height="55">
            <img class="dark-visible"
                 src="{% static 'images/nlnet-wit.png' %}"
                 alt="NLnet logo"
                 loading="lazy"
                 width="146"
                 height="55">
          </a>
        </li>
        <li>
          <a href="https://ripe.net/"
             target="_blank"
             aria-label="RIPE NCC website">
            <img class="light-visible"
                 src="{% static 'images/ncc.png' %}"
                 alt="RIPE NCC logo"
                 loading="lazy"
                 width="180"
                 height="32">
            <img class="dark-visible"
                 src="{% static 'images/ncc-wit.png' %}"
                 alt="RIPE NCC logo"
                 loading="lazy"
                 width="180"
                 height="32">
          </a>
        </li>
        <li>
          <a href="https://verenigingvanregistrars.nl/"
             target="_blank"
             aria-label="VvR website">
            <img class="light-visible"
                 src="{% static 'images/vvr.png' %}"
                 alt="VvR logo"
                 loading="lazy"
                 width="200"
                 height="46">
            <img class="dark-visible"
                 src="{% static 'images/vvr-wit.png' %}"
                 alt="VvR logo"
                 loading="lazy"
                 width="200"
                 height="46">
          </a>
        </li>
      </ul>
      {% if link %}
        <a class="about-link secondary-button icon" href="/about/">
          {% translate "about link" %}
        </a>
      {% endif %}
    </div>
  </section>
{% endif %}
